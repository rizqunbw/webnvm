<section id="nvm-donatelist" class="nvm-donate">
  <header class="nvm-donate__hero">
    <div class="nvm-donate__hero-heading">
      <span class="nvm-donate__eyebrow">RF NEVERMIND · AGE OF PATRON</span>
      <h2 class="nvm-donate__title">Donate <span>List</span></h2>
      <p class="nvm-donate__subtitle">Donation packages for RF Nevermind.</p>
    </div>
    <div class="nvm-donate__level" aria-label="Number of donation packages"><span>PACKAGES</span><strong data-nvm-donate-count>0</strong></div>
  </header>

  <section class="nvm-donate__section" aria-labelledby="nvm-donate-directory-title">
    <div class="nvm-donate__section-head"><h3 id="nvm-donate-directory-title"><i class="fa-solid fa-hand-holding-heart" aria-hidden="true"></i> Donation Packages</h3><span id="nvm-donate-count" class="nvm-donate__count">0 PACKAGES</span></div>
    <div class="nvm-donate__toolbar">
      <label class="nvm-donate__search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span class="nvm-donate__sr-only">Search donation package</span><input id="nvm-donate-search" type="search" placeholder="Search package or reward..." autocomplete="off"></label>
      <label><span class="nvm-donate__sr-only">Filter by category</span><select id="nvm-donate-category"><option value="">All Categories</option></select></label>
    </div>
    <div id="nvm-donate-results" class="nvm-donate__results" aria-live="polite"></div>
  </section>

  <section class="nvm-donate__section" aria-labelledby="nvm-donate-note-title">
    <div class="nvm-donate__section-head"><h3 id="nvm-donate-note-title"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> About This List</h3></div>
    <div class="nvm-donate__notice"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><div><b>Donate list is being prepared</b><p>Donation packages, prices, and rewards will be published here once verified. No package is listed yet.</p></div></div>
  </section>

  <script type="application/json" id="nvm-donate-data">[]</script>
</section>
